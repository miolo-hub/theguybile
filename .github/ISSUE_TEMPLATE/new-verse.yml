# Generated by scripts/build.py from content/. Edit the build script, not this file.
name: Suggest a verse
description: Add a verse to The Guybile. The maintainer reviews every one before it goes live.
title: "Verse: "
labels: ["verse"]
body:
  - type: markdown
    attributes:
      value: |
        Like a suggestion someone else made? Give it a 👍. The most-loved ones get read first.

        Write it like scripture: one or two sentences, funny on the surface, true underneath.
        Keep it kind. No names of real private people, nothing hateful, nothing that would hurt a brother who is already down.
  - type: dropdown
    id: chapter
    attributes:
      label: Chapter
      description: Where does it belong? Pick "A new topic" if none fit.
      options:
        - "Chapter 1 — The Laws of Brotherhood"
        - "Chapter 2 — The Laws of Plans"
        - "Chapter 3 — The Laws of Food"
        - "Chapter 4 — The Laws of Life"
        - "Chapter 5 — The Seasons of a Man"
        - "Chapter 6 — The Laws of Money and Work"
        - "Chapter 7 — The Laws of Women, Love and Respect"
        - "Chapter 8 — The Laws of the Mind"
        - "Chapter 9 — The Laws of the Body"
        - "Chapter 10 — The Laws of Fatherhood and Family"
        - "Chapter 11 — The Laws of Failure, Loss and Grief"
        - "Chapter 12 — The History of Man"
        - "Chapter 13 — The Laws of the Group Chat"
        - "Chapter 14 — The Laws of Games and Sports"
        - "Chapter 15 — The Laws of Cars, Gadgets and Tools"
        - "Chapter 16 — The Laws of Travel and Road Trips"
        - "Chapter 17 — The Laws of Weddings, Bachelor Parties and Funerals"
        - "Chapter 18 — The Laws of Social Media and the Internet"
        - "Chapter 19 — The Laws of Dating in the App Era"
        - "Chapter 20 — The Laws of Marriage and Long-Term Love"
        - "Chapter 21 — The Laws of Friendship After Thirty"
        - "Chapter 22 — The Laws of Conflict and Anger"
        - "Chapter 23 — The Laws of Leadership and Mentorship"
        - "Chapter 24 — The Laws of Addiction and Recovery"
        - "Chapter 25 — The Laws of Health Scares and Ageing"
        - "Chapter 26 — Fatherhood Without Fathers"
        - "Chapter 27 — The Laws of Mistakes and Making Amends"
        - "Chapter 28 — The Laws of Faith, Meaning and Purpose"
        - "Chapter 29 — The Final Verses and the Brother's Oath"
        - "A new topic (name it below)"
    validations:
      required: true
  - type: input
    id: topic
    attributes:
      label: New topic name
      description: Only if you picked "A new topic". For example "Pets", "Cooking for One", "Moving Abroad".
  - type: textarea
    id: verse
    attributes:
      label: Your verse
      description: Just the verse. The number is added for you.
      placeholder: "Thou shalt not reply 'k' to a paragraph."
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: Credit (optional)
      description: Thy name or handle, shown under the verse and on the Authors page. Leave empty to stay anonymous.
  - type: checkboxes
    id: terms
    attributes:
      label: The fine print
      options:
        - label: I wrote this verse myself, and I am happy for it to be published in The Guybile under its licence.
          required: true
